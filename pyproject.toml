[project]
name = "how-tui"
version = "1.0.3"
description = "Terminal command assistant"
readme = "PYPI.md"
authors = [
    { name = "Noah Hefner", email = "nhefner127+github@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "google-genai>=2.25.0",
    "groq>=1.7.0",
    "keyring>=25.7.0",
    "platformdirs>=4.11.13",
    "pydantic>=2.13.5",
    "questionary>=2.1.1",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "uv-upsync>=2.4.2",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[project.scripts]
how = "how_tui.cli:main"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:google.genai",
]
